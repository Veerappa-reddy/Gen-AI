info:
  name: OpenAPI
  type: http

http:
  method: POST
  url: http://127.0.0.1:8000/chat
  body:
    type: json
    data: |-
      {
        "user_message": "andhra pradesh",
        "user_id": 102
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
